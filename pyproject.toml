[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodconn"
version = "2.0.0"
description = "Develops sequence to sequence control-oriented deep neural networks in a highly modular way."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Gaurav Chaudhary", email = "gaurav.chaudhary@ntnu.no"}
]
maintainers = [
    {name = "Gaurav Chaudhary", email = "gaurav.chaudhary@ntnu.no"}
]
keywords = [
    "deep-learning",
    "neural-networks",
    "sequence-to-sequence",
    "tensorflow",
    "keras",
    "time-series",
    "forecasting",
    "attention-mechanism",
    "transformer",
    "rnn",
    "tcn"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "tensorflow>=2.15.0,<3.0.0",
    "keras>=3.0.0,<4.0.0",
    "numpy>=1.24.0,<2.0.0",
    "PyYAML>=6.0.0",
    "jsonschema>=4.17.0",
    "tensorflow-addons>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pre-commit>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "bandit>=1.7.0",
    "safety>=2.0.0"
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0"
]

[project.urls]
Homepage = "https://github.com/gaurav306/pymodconn"
Repository = "https://github.com/gaurav306/pymodconn"
Documentation = "https://github.com/gaurav306/pymodconn#readme"
"Bug Tracker" = "https://github.com/gaurav306/pymodconn/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymodconn*"]
exclude = ["tests*", "TESTS*"]

[tool.setuptools.package-data]
pymodconn = ["configs/*.yaml", "py.typed"]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pymodconn"]
known_third_party = ["tensorflow", "keras", "numpy", "yaml", "jsonschema"]

# mypy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "tensorflow.*",
    "keras.*",
    "tensorflow_addons.*"
]
ignore_missing_imports = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Coverage configuration
[tool.coverage.run]
source = ["pymodconn"]
omit = [
    "*/tests/*",
    "*/TESTS/*",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]

# Bandit security linter configuration
[tool.bandit]
exclude_dirs = ["tests", "TESTS"]
skips = ["B101"]  # Skip assert_used test

# Flake8 configuration (in setup.cfg since flake8 doesn't support pyproject.toml yet)
